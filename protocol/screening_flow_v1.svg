<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="3087px" preserveAspectRatio="none" style="width:1635px;height:3087px;background:#FFFFFF;" version="1.1" viewBox="0 0 1635 3087" width="1635px" zoomAndPan="magnify"><title>Triagem por titulo e resumo &#8212; UML Quality SLR (protocolo v1.7)</title><defs/><g><g class="header" data-source-line="25"><text fill="#888888" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="189.0398" x="1433.9586" y="20.69">Instrumento de calibracao dos revisores</text></g><g class="title" data-source-line="23"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="445.2123" x="593.893" y="49.5859">Triagem por titulo e resumo &#8212; UML Quality SLR (protocolo v1.7)</text></g><ellipse cx="817.9992" cy="74.6879" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><path d="M981.5361,96.0682 L981.5361,127.032 L961.5361,131.032 L981.5361,135.032 L981.5361,165.9958 A0,0 0 0 0 981.5361,165.9958 L1240.3214,165.9958 A0,0 0 0 0 1240.3214,165.9958 L1240.3214,106.0682 L1230.3214,96.0682 L981.5361,96.0682 A0,0 0 0 0 981.5361,96.0682" fill="#F1F1F1" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M1230.3214,96.0682 L1230.3214,106.0682 L1240.3214,106.0682 L1230.3214,96.0682" fill="#F1F1F1" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="110.5492" x="987.5361" y="112.8272">Principio orientador</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="226.3674" x="987.5361" y="127.809">Nesta etapa nao se inclui nada. So se exclui.</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="225.7844" x="987.5361" y="142.7909">I1..I6 nao sao aplicados positivamente aqui.</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="237.7853" x="987.5361" y="157.7728">A incerteza SEMPRE retem (protocolo, l. 1263).</text><rect fill="#FFFFFF" height="52.6882" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="287.0739" x="674.4623" y="104.6879"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="115.5008" x="684.4623" y="127.516">Registro recuperado</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="267.0739" x="684.4623" y="143.8601">(titulo + resumo + palavras-chave + metadados)</text><rect fill="#FAFAFA" height="846.7274" style="stroke:#888888;stroke-width:1.5;" width="554.089" x="678.3124" y="175.9958"/><path d="M1100.8515,175.9958 L1100.8515,185.3399 L1090.8515,195.3399 L678.3124,195.3399" fill="none" style="stroke:#888888;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="412.5391" x="681.3124" y="189.8239">PORTAO A &#8212; formal e metadado (objetivo, sem julgamento de conteudo)</text><path d="M955.982,269.6674 L955.982,300.6312 L935.982,304.6312 L955.982,308.6312 L955.982,339.5949 A0,0 0 0 0 955.982,339.5949 L1200.4014,339.5949 A0,0 0 0 0 1200.4014,339.5949 L1200.4014,279.6674 L1190.4014,269.6674 L955.982,269.6674 A0,0 0 0 0 955.982,269.6674" fill="#F1F1F1" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M1190.4014,269.6674 L1190.4014,279.6674 L1200.4014,279.6674 L1190.4014,269.6674" fill="#F1F1F1" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="183.9297" x="961.982" y="286.4263">Antes de excluir, verificar a clausula</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="223.4194" x="961.982" y="301.4082">de extensao do intervalo (protocolo, l. 192):</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="151.4799" x="961.982" y="316.3901">so se aplica se houver estudo</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="42.7897" x="1116.3219" y="316.3901">elegivel</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="81.7294" x="961.982" y="331.372">anterior a 2022.</text><rect fill="#FFCDD2" height="52.6882" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="235.9656" x="700.0164" y="278.287"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="63.0004" x="710.0164" y="301.1151">EXCLUIR &#8212;</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="13.5841" x="776.1369" y="301.1151">E4</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="215.9656" x="710.0164" y="317.4593">fora do escopo temporal ou de idioma</text><ellipse cx="817.9992" cy="370.5949" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="817.9992" cy="370.5949" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#FFF8E1" points="702.8584,212.3399,933.14,212.3399,945.14,228.684,933.14,245.0281,702.8584,245.0281,690.8584,228.684,702.8584,212.3399" style="stroke:#B8860B;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.6239" x="821.9992" y="256.787">nao</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="230.2816" x="702.8584" y="225.168">A1. Ano entre jan/2022 e a data da busca</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.9171" x="702.8584" y="241.5121">E relato escrito em ingles