><polygon fill="#555555" points="813.9992,2592.7988,817.9992,2602.7988,821.9992,2592.7988,817.9992,2596.7988" style="stroke:#555555;stroke-width:1;"/><line style="stroke:#555555;stroke-width:1;" x1="817.9992" x2="817.9992" y1="2639.1429" y2="2690.9165"/><polygon fill="#555555" points="813.9992,2680.9165,817.9992,2690.9165,821.9992,2680.9165,817.9992,2684.9165" style="stroke:#555555;stroke-width:1;"/><line style="stroke:#555555;stroke-width:1;" x1="817.9992" x2="817.9992" y1="2808.9812" y2="2828.9812"/><polygon fill="#555555" points="813.9992,2818.9812,817.9992,2828.9812,821.9992,2818.9812,817.9992,2822.9812" style="stroke:#555555;stroke-width:1;"/><g class="legend" data-source-line="184"><rect fill="#DDDDDD" height="185.6113" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="1588.9984" x="22" y="2861.9812"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="3.64" x="27" y="2883.9471">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="70.7778" y="2883.9471">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="234.4011" x="74.4178" y="2883.9471">Regras de ouro da primeira etapa</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="308.8189" y="2883.9471">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="8.008" x="30.64" y="2903.015">1</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="374.6946" x="74.4178" y="2903.015">A incerteza retem. Se houve hesitacao, o registro avanca.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="8.008" x="30.64" y="2922.0829">2</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="338.1267" x="74.4178" y="2922.0829">Ausencia de vocabulario de qualidade nunca exclui.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="8.008" x="30.64" y="2941.1509">3</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="604.1119" x="74.4178" y="2941.1509">Um criterio primario por exclusao: o primeiro do fluxograma que explica claramente o caso.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="8.008" x="30.64" y="2960.2188">4</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="573.6898" x="74.4178" y="2960.2188">Exclusao e nao destrutiva: o registro permanece, marcado e justificado, para o PRISMA.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="8.008" x="30.64" y="2979.2867">5</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="586.6816" x="74.4178" y="2979.2867">Nao sobrecarregar I2/E6. Entrada = I4/E9, tarefa = I3/E8, saida = I5/E7, evidencia = I6/E11.</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="3.64" x="27" y="2998.3546">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="70.7778" y="2998.3546">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="135.6315" x="74.4178" y="2998.3546">Regras de fronteira</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="210.0493" y="2998.3546">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="36.4978" x="30.64" y="3017.4225">RF-01</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="1527.9407" x="74.4178" y="3017.4225">Encoder pre-instrucional (BERT, RoBERTa) so satisfaz I2 se o uso for gerativo ou semanticamente constitutivo do conteudo UML. Como classificador, tagger, extrator, embeddings ou NER: E6. Se o resumo nao permitir distinguir: reter.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="36.4978" x="30.64" y="3036.4904">RF-02</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="1437.9777" x="74.4178" y="3036.4904">O LLM e substantivo quando tem autoridade semantica sobre elementos UML portadores de significado. A presenca de regras simbolicas no pipeline e irrelevante; o que decide e quem determina o conteudo semantico.</text><line style="stroke:#000000;stroke-width:1;" x1="27" x2="1605.9984" y1="2868.9812" y2="2868.9812"/><line style="stroke:#000000;stroke-width:1;" x1="27" x2="1605.9984" y1="2888.0491" y2="2888.0491"/><line style="stroke:#000000;stroke-width:1;" x1="27" x2="1605.9984" y1="2907.117" y2="2907.117"/><line style="stroke:#000000;stroke-width:1;" x1="27" x2="1605.9984" y1="2926.1849" y2="2926.1849"/><line style="stroke:#000000;stroke-width:1;" x1="27" x2="1605.9984" y1="2945.2528" y2="2945.2528"/><line style="stroke:#000000;stroke-width:1;" x1="27" x2="1605.9984" y1="2964.3208" y2="2964.3208"/><line style="stroke:#000000;stroke-width:1;" x1="27" x2="1605.9984" y1="2983.3887" y2="2983.3887"/><line style="stroke:#000000;stroke-width:1;" x1="27" x2="1605.9984" y1="3002.4566" y2="3002.4566"/><line style="stroke:#000000;stroke-width:1;" x1="27" x2="1605.9984" y1="3021.5245" y2="3021.5245"/><line style="stroke:#000000;stroke-width:1;" x1="27" x2="1605.9984" y1="3040.5924" y2="3040.5924"/><line style="stroke:#000000;stroke-width:1;" x1="27" x2="27" y1="2868.9812" y2="3040.5924"/><line style="stroke:#000000;stroke-width:1;" x1="70.7778" x2="70.7778" y1="2868.9812" y2="3040.5924"/><line style="stroke:#000000;stroke-width:1;" x1="1605.9984" x2="1605.9984" y1="2868.9812" y2="3040.5924"/></g><g class="footer" data-source-line="26"><text fill="#888888" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="202.9399" x="715.0293" y="3071.2824">screening_manual_v1.md &#8212; v1, 2026-08-15</text></g><?plantuml-src lLdjRjiu5ltlfo2oFoRnE4wTf6cQJ3jm77NNG3wyJZeeq1G1BT4EMqbKISbDkxF0FiG-uJx9ddj9sSfdCuFkkaWZInHvUU-vvvxB_2HU_S1FwoSXpgsMCvM9mbXHwh9AZL32AbTbHlpdN_yMRu-FnDyhcUhogpWx6jChXtZ3oaoAH0bPwhbE9AvYO_5QOV94vIKU635Dgskp6EbYgrIkyzbb9dDCU3dlTRE4vXjPKvhOOEM4bfugg_9OopqXYqBbYRw-BB-OorH-LHRl5WNDKOHtCClbYswfhccYtvHrMBV7Xcy-sznPVxQxtdkEHp_KQottIUU5nCQ4kvA9-GA3n5IcJZMU96eggxHyO_BoJ7zJehVPUDYtrdmPOCTM_EKvVsu_NBxNQpwAoTtbrmDZ4sN315lykM-KZ3_DhAdo98nymvzxHYAY6G9ttmkxKU-H5vfs7EpkxZmxU7Zm_QuOIGlOQPFVc6kNF_SEksDZd_urXfwOKjqTrQD_jqSrb-ppvzQ8PXXQC21LVpHXn6gnW3SG_sAjrRfIo1ShXhahRPKXMnZuCLwPM1a3m8bnc76kdS6yhQc18VQ1_E4bvxrE4-ujLy9RhTRUMCqqrZ2OBAuAPO7LYtmr6FrpRVJFef2fd5lfrkChELUuaQbI8gcDMzjljN8iBwoUNPKj8ThjaTN8pa8ROQo6yHXcssqyEb5OL-3DGeeSkt1AO6HQQNnBP5USyIrrJRUw63_iTRl37JyKFx98TKnhmhCEePxBp1F9Pp-yJxCfMwflKfn5nwDnX0sK2CJImHsHTe6kdQsrRWl48SZore_D_bPH0r6iZ4x7v_rJ64Onc1gRoHHGg7qdLitaey8-O9Q3cH-hT2QNqGQmL9MOjHNnZnPsfwTYjT_hYduEEEMbLUAZp3SGr4rC2VwK9Vqd9fMBvKLEMqybPb90XQRV6RmpIvNxTKsKLoeNgt3h6kOLOYzwDpXwEnopbUrsjDrkN-Im5lFn-wOm0cu4d66-gSWudMYJoNtnoozWWC7XuURhrppL3IJGfuzDE7h3HzLsn5nPFKKSBOoEKrcvAfLXC0yhLUuOuR0Ng9vB8F5s05zkhks5TnnZnaE3hgvCXHLWTWdVOJSg1SJdAcK0qaVIhDhGykIyBjzUO86dB4s12mMw5gjEP-GbgZBJHHWsko8ILLRxE2QKqwPmQR8YLQNvlfTxv6M2jdfacYTuE4eGNZ1EsX45IgECDPpqINsbWHrHLk5XxQvK9yfrA8FWXax8y7M9CYfn6y5IzT1KposcAcH9MOR0cHHSn2KzbzhzASTjaUD2R0ghCub8VDzLc-Igy9O3KUK9lKTGn1wW0_3b2Ouwg-nSVSLyo19mByYkhAnijyKh4GKOB0R1_mIUpnLMHIRpShWN1d66W-48IeudkBMbUhQ_LjB2Lde1uCpDbubCKz82AWm0kg6DcD53wlufjswJMstDvLKE27tVgrlarQJYp05tm9kPoYPu7nG4ZgqXY34AsYNJgMQLLbGJUWCsFy7dXoeiG5jijmdkW1-A6h5tkrqdyHp43HgmN39hazGbrUTYuQlbVMjIu36lSgGyQibCsZ_ajN_-xnd_W9tigWaANauC3nCa8YtMNrDH97M0gqIZxC8bk2H6Hr6e